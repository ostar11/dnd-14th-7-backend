version: '3.8'

services:
  app:
    image: ahaive-backend:latest
    container_name: ahaive-backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - db
      - elasticsearch
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 2g

  db:
    image: pgvector/pgvector:pg16
    container_name: ahaive-db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 2g

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.3
    container_name: es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false   # 개발용. 운영은 true 권장
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 2g

  nginx:
    image: nginx:latest
    container_name: ahaive-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./data/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./data/nginx/app.conf:/etc/nginx/conf.d/default.conf
      - ./public:/public
      - ./data/certbot/www:/var/www/certbot
      - ./data/certbot/conf:/etc/letsencrypt
    depends_on:
      - app
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  pgvector-data:
  es_data:

